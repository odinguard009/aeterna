<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Aeterna Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Public+Sans:wght@400;500;600&display=swap">
<style>
/* layout: root node on the left, ten phase branches hanging off a spine on the right; stacks on phones */
:root{--bg:#eef1f5;--panel:#ffffff;--fg:#0f1b27;--mute:#52667a;--line:#b9c6d3;--accent:#9a5b00;--accent-bg:#fbefd8;
--done:#1c7c4a;--doing:#9a5b00;--next:#2459b8;--later:#667889;--you:#b3202a;
--font-d:"Rajdhani","Arial Narrow",system-ui,sans-serif;--font-b:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a1118;--panel:#111d29;--fg:#e8eef4;--mute:#93a7ba;--line:#2c4156;--accent:#e5a93c;--accent-bg:#2a2112;--done:#4fc183;--doing:#e5a93c;--next:#6aa0f5;--later:#8a9bab;--you:#ff6b72;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0a1118;--panel:#111d29;--fg:#e8eef4;--mute:#93a7ba;--line:#2c4156;--accent:#e5a93c;--accent-bg:#2a2112;--done:#4fc183;--doing:#e5a93c;--next:#6aa0f5;--later:#8a9bab;--you:#ff6b72;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font-b);font-size:15px;line-height:1.5;padding-inline:16px;padding-block:28px 48px}
.wrap{max-width:1040px;margin-inline:auto;display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:28px;align-items:start}
.root{position:sticky;top:20px;display:flex;flex-direction:column;gap:14px}
.rn{background:var(--accent);color:#fff;border-radius:999px 999px 999px 999px;padding:22px 20px;text-align:center}
:root[data-theme="dark"] .rn{color:#0b1319}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .rn{color:#0b1319}}
.rn h1{font-family:var(--font-d);font-size:30px;line-height:1.05;margin:0;letter-spacing:.04em;text-transform:uppercase;text-wrap:balance}
.rn p{margin:8px 0 0;font-size:13px;opacity:.92}
.prog{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:12px 14px}
.prog h2{font-family:var(--font-d);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px;color:var(--mute)}
.bar{display:flex;gap:2px;height:12px;border-radius:6px;overflow:hidden}
.seg.s-done{background:var(--done)}.seg.s-doing{background:var(--doing)}.seg.s-next{background:var(--next)}.seg.s-later{background:var(--line)}.seg.s-you{background:var(--you)}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;margin:10px 0 0;padding:0;list-style:none;font-size:12.5px;color:var(--mute)}
.legend li{display:flex;align-items:center;gap:5px}.legend b{color:var(--fg);font-variant-numeric:tabular-nums}
.sw{width:9px;height:9px;border-radius:50%;display:inline-block}
.note{font-size:13px;color:var(--mute);border-left:3px solid var(--you);padding-left:10px}
.note b{color:var(--fg)}
.tree{position:relative;display:flex;flex-direction:column;gap:14px;padding-left:28px}
.tree::before{content:"";position:absolute;left:11px;top:22px;bottom:22px;width:2px;background:var(--line)}
.branch{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:10px}
.branch::before{content:"";position:absolute;left:-17px;top:26px;width:17px;height:2px;background:var(--line)}
summary{list-style:none;display:flex;align-items:center;gap:12px;padding:12px 14px;cursor:pointer;flex-wrap:wrap}
summary::-webkit-details-marker{display:none}
summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.core{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:18px;border:2px solid var(--c,var(--line));color:var(--c,var(--fg));background:var(--bg)}
.b-done{--c:var(--done)}.b-doing{--c:var(--doing)}.b-next{--c:var(--next)}.b-later{--c:var(--later)}
.bh{display:flex;flex-direction:column;min-width:0;flex:1 1 200px}
.bn{font-family:var(--font-d);font-size:20px;font-weight:700;line-height:1.1;letter-spacing:.02em}
.bs{font-size:13px;color:var(--mute)}
.bm{display:flex;align-items:center;gap:10px;font-size:12px;color:var(--mute);margin-left:auto}
.chip{font-weight:600;border:1px solid var(--c);color:var(--c);border-radius:999px;padding:1px 9px}
.c-done{--c:var(--done)}.c-doing{--c:var(--doing)}.c-next{--c:var(--next)}.c-later{--c:var(--later)}
.ver,.frac{font-variant-numeric:tabular-nums}
.leaves{list-style:none;margin:0;padding:2px 14px 14px 60px;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:6px 18px}
.leaf{display:flex;align-items:baseline;gap:8px;min-width:0}
.dot{flex:none;width:9px;height:9px;border-radius:50%;background:var(--c);transform:translateY(0)}
.s-done{--c:var(--done)}.s-doing{--c:var(--doing)}.s-next{--c:var(--next)}.s-later{--c:var(--later)}.s-you{--c:var(--you)}
.leaf.s-later .dot,.leaf.s-next .dot{background:transparent;border:2px solid var(--c)}
.leaf.s-you .dot{border-radius:50%;box-shadow:0 0 0 3px color-mix(in srgb,var(--you) 30%,transparent)}
.lt{flex:1;min-width:0}
.lb{flex:none;font-size:11px;font-weight:600;color:var(--c);text-transform:uppercase;letter-spacing:.06em}
.leaf.s-done .lt{color:var(--mute)}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}.root{position:static}.leaves{padding-left:16px}.bm{margin-left:46px;flex-basis:100%}}
@media (prefers-reduced-motion:no-preference){.branch{transition:border-color .15s}.branch:hover{border-color:var(--c)}}
</style>
<style>
.flow{list-style:none;counter-reset:st;margin:0;padding:4px 14px 16px 60px;display:flex;flex-direction:column;gap:0}
.flow li{position:relative;display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:4px 10px;align-items:start;padding:8px 0 14px}
.flow li::after{content:"";position:absolute;left:13px;top:36px;bottom:-2px;width:2px;background:var(--line)}
.flow li:last-child::after{display:none}
.flow .n{counter-increment:st;width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-family:var(--font-d);font-weight:700;font-size:15px;border:2px solid var(--c);color:var(--c);background:var(--bg)}
.flow .n::before{content:counter(st)}
.flow li.s-done .n{background:var(--c);color:var(--panel)}
.flow .t{font-weight:600}.flow .d{grid-column:2/4;font-size:13px;color:var(--mute);margin-top:-2px}
.flow code{font-size:12px;background:var(--bg);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.flow .lb{align-self:center}
.upd{font-size:12px;color:var(--mute);margin:0}
@media (max-width:820px){.flow{padding-left:16px}}
.tokwrap{overflow-x:auto;padding:2px 14px 14px 14px}
.tok{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
.tok th,.tok td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.tok thead th{font-family:var(--font-d);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.tok tbody th{font-weight:600;white-space:nowrap}.tok .sd{display:block;font-weight:400;font-size:11.5px;color:var(--mute)}
.tok .tn{min-width:130px;font-variant-numeric:tabular-nums}.tok .tn b{display:block}
.tok .tb{display:block;height:8px;margin-top:4px;border-radius:3px;background:color-mix(in srgb,var(--next) 55%,transparent)}
.tok .tb.est{background:repeating-linear-gradient(45deg,color-mix(in srgb,var(--next) 55%,transparent) 0 4px,transparent 4px 8px);outline:1px dashed var(--next)}
.tok .tc,.tok .tw{white-space:nowrap}.tok .tx{color:var(--mute)}
</style>
{{WRAP}}

</body></html>
