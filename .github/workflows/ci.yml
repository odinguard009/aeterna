# Runs on every push and pull request: build check, lint, unit + property tests (headless Chromium).
# The Python Playwright regression (tests/run_all.py) stays a release step in Claude's workspace (see CLAUDE.md).
name: CI
# Actions minutes: run on main only, skip docs-only commits, cancel superseded runs (2026-10-17).
on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md', '.claude/**']
  pull_request:
    paths-ignore: ['docs/**', '**.md', '.claude/**']
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dev tools (Playwright + TypeScript only)
        run: npm install --no-save playwright typescript && npx playwright install --with-deps chromium
      - name: index.html is the build of src/
        run: npm run check
      - name: Lint
        run: npm run lint
      - name: Unit and property tests
        run: npm test
